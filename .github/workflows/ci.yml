name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Tests assume a macOS environment (launchd paths, /var symlink, etc.)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
